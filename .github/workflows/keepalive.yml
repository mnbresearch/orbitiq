# ============================================================
# OrbitIQ warm-up — MANUAL ONLY. This no longer runs on a schedule.
#
# ── Why the schedule was removed ─────────────────────────────
# This used to ping hourly from 03:00-19:59 UTC to keep the free Render
# instance from spinning down, and it reported a tidy projection every run:
#
#     17 h/day x 30 days = 510 h of the 750 h monthly quota
#
# That projection was fiction, and the run log proves it. The cron asks for
# 17 runs a day. GitHub delivered four:
#
#     8 Sep   07:55, 12:44, 17:09, 20:55
#     9 Sep   07:59, 12:49, 17:04, 19:42
#    10 Sep   07:58   (checked at 09:59 — the service was asleep)
#
# Each run covers 55 minutes, so the actual warm coverage was under four hours
# a day, arriving at unpredictable times, with three- and four-hour holes in
# the middle of the window the workflow claimed to cover. Every run was green.
#
# This is the same failure the old "*/10" version had, one level up: that
# version lost individual ticks and was fixed with an in-run loop, but the loop
# only spans an hour and GitHub is dropping whole blocks of hours. A green run
# still only proves the ping happened, not that it happened in time.
#
# ── Why it was not simply repaired ───────────────────────────
# Because keeping it working was the expensive option, not the cheap one.
# Delivering the intended 17 h/day would have spent ~510 h of the 750 h quota
# to hold an instance warm for visitors who mostly were not there — and the
# quota is shared by every free service in the workspace, so spending it here
# is spending it everywhere.
#
# The actual problem was never "the instance sleeps". It was "a sleeping
# instance makes the reader wait ~50 s for HTML that has not changed since the
# last deploy". That is a caching problem, and it is now fixed as one: the
# marketing pages ship with `stale-while-revalidate`, so a cache can serve the
# page instantly and let the instance wake on its own time. See the cache
# header block in server.js.
#
# Sleeping is now the intended state. It costs nothing and the site stays fast.
#
# ── What this is still good for ──────────────────────────────
# Warming the instance deliberately: before a demo, a call, or sending the link
# to someone who will click it once and judge the product on that click. Run it
# from the Actions tab and give it a minute.
#
# Liveness alerting moved to witness.yml, which already probes the public
# endpoint hourly and can tell a sleeping instance from a broken one.
# ============================================================
name: Warm-up (manual)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep it warm (minutes, max 55)"
        required: false
        default: "10"

concurrency:
  group: orbitiq-warmup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Warm the instance
        env:
          URL: https://orbit.mnbresearch.com/api/health
          WARM_URL: https://orbit.mnbresearch.com/api/status
          MINUTES: ${{ inputs.minutes }}
        run: |
          mins=${MINUTES:-10}
          case "$mins" in ''|*[!0-9]*) mins=10 ;; esac
          [ "$mins" -gt 55 ] && mins=55
          deadline=$(( $(date +%s) + mins * 60 ))
          echo "warming for $mins minute(s)"

          ping_once () {
            : > /tmp/body
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 \
                     -A "OrbitIQ-warmup/3 (github.com/${{ github.repository }})" "$URL") || code="000"
            echo "$(date -u +%H:%M:%S) -> HTTP $code"
            [ "$code" = "200" ]
          }

          ok=0; attempts=0; warmed=0
          while :; do
            attempts=$(( attempts + 1 ))
            # A cold instance takes ~50 s to wake and the first request pays for
            # it, so one retry before counting a miss.
            if ping_once || { sleep 20; ping_once; }; then
              ok=$(( ok + 1 ))
              # /api/health answers without touching the catalogue. Warming the
              # process is not the same as warming the data it serves, so pull
              # /api/status once to build the catalogue too.
              if [ "$warmed" = "0" ]; then
                curl -s -o /dev/null -w "catalogue warm-up HTTP %{http_code}\n" --max-time 120 "$WARM_URL" || true
                warmed=1
              fi
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 300
          done

          echo "kept warm with $ok/$attempts successful pings"
          [ "$ok" -gt 0 ] || { echo "::error::service never returned 200"; exit 1; }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · OrbitIQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6.5' fill='%2367b6ff'/><ellipse cx='16' cy='16' rx='13.5' ry='5.2' transform='rotate(-28 16 16)' fill='none' stroke='%237cf0ff' stroke-width='1.6'/><circle cx='27.9' cy='9.7' r='2.2' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css?v=17">
<style>
  body { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .side { position: relative; overflow: hidden; border-right: 1px solid var(--line); background: radial-gradient(700px 500px at 30% 40%, rgba(40,110,220,.2), transparent 60%), var(--bg-2); display: flex; flex-direction: column; justify-content: space-between; padding: 40px; }
  .side h2 { margin: 0; font: 600 clamp(30px, 3vw, 42px)/1.08 var(--font); letter-spacing: -.035em; max-width: 14ch; }
  .side p { color: var(--dim); max-width: 42ch; margin: 16px 0 0; }
  .side .orb { position: absolute; right: -180px; bottom: -180px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2b6fc4, #0a2348 60%, #04060a 72%); box-shadow: 0 0 120px rgba(80,160,255,.25); opacity: .9; }
  .side .ring { position: absolute; right: -320px; bottom: -40px; width: 800px; height: 240px; border: 1.5px solid rgba(124,240,255,.35); border-radius: 50%; transform: rotate(-24deg); }
  .main { display: grid; place-items: center; padding: 40px 24px; }
  .box { width: min(400px, 100%); }
  .box h1 { margin: 0; font: 600 28px/1.2 var(--font); letter-spacing: -.03em; }
  .box .sub { margin: 8px 0 28px; color: var(--dim); }
  label { display: block; margin-bottom: 16px; font-size: 13px; color: var(--dim); }
  input { display: block; width: 100%; margin-top: 7px; height: 46px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,.025); color: var(--text); font: 400 15px var(--font); }
  input:focus { outline: none; border-color: var(--accent); background: rgba(124,240,255,.04); }
  form .btn { width: 100%; margin-top: 4px; }
  .alt { margin-top: 18px; font-size: 13.5px; color: var(--faint); text-align: center; }
  .alt a, .alt button { color: var(--dim); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .alt a:hover, .alt button:hover { color: var(--text); }
  .msg { display: none; margin-top: 14px; padding: 11px 13px; border-radius: 10px; font-size: 13.5px; }
  .msg.err { display: block; background: rgba(255,122,122,.1); color: var(--red); }
  .msg.ok { display: block; background: rgba(110,231,168,.1); color: var(--green); }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } .side { display: none; } }
</style>
</head>
<body>
<aside class="side" aria-hidden="true">
  <a class="brand" href="/"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6.5" fill="#3a7fd0"/><ellipse cx="16" cy="16" rx="13.5" ry="5.2" transform="rotate(-28 16 16)" fill="none" stroke="#7cf0ff" stroke-width="1.5"/><circle cx="27.9" cy="9.7" r="2.2" fill="#fff"/></svg>Orbit<b>IQ</b></a>
  <div style="position:relative;z-index:1">
    <h2>Know what's coming. Prove what you knew.</h2>
    <p>Screening, decisions and evidence for your fleet, in one record your insurer or regulator can verify.</p>
  </div>
  <div class="orb"></div><div class="ring"></div>
</aside>
<main class="main">
  <div class="box">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="mode-sub">to your OrbitIQ workspace</p>

    <form id="login-form">
      <label>Email<input id="li-email" type="email" autocomplete="email" required autofocus></label>
      <label>Password<input id="li-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn lg primary" id="li-btn" type="submit">Sign in</button>
      <div class="alt">No account? <a href="/#request">Request access</a> · <button type="button" id="to-key">Sign in with an admin key</button></div>
    </form>

    <form id="key-form" hidden>
      <label>Admin workspace API key<input id="ky-key" type="password" placeholder="oiq_…" autocomplete="off" required></label>
      <button class="btn lg primary" id="ky-btn" type="submit">Sign in with key</button>
      <div class="alt"><button type="button" id="to-login">Use email and password</button></div>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <div class="alt" style="margin-top:28px"><a href="/sky">Explore the public live sky</a> · <a href="/">Home</a></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); };
function mode(m) {
  $("login-form").hidden = m !== "login";
  $("key-form").hidden = m !== "key";
  $("title").textContent = m === "key" ? "Admin key" : "Sign in";
  $("mode-sub").textContent = m === "key" ? "For administrators recovering access with a workspace key" : "to your OrbitIQ workspace";
  $("msg").className = "msg";
}
$("to-key").onclick = () => mode("key");
$("to-login").onclick = () => mode("login");

async function signIn(body, btn, label) {
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Sign-in failed");
    localStorage.setItem("orbitiq-session", d.token);
    localStorage.setItem("orbitiq-user", JSON.stringify(d.user));
    if (d.workspace && d.workspace.apiKey) localStorage.setItem("orbitiq-apikey", d.workspace.apiKey);
    msg("Signed in" + (d.user.name ? " as " + d.user.name : "") + " — opening…", true);
    // Operators go to the console, administrators to the admin page.
    location.href = d.user.role === "admin" ? "/admin.html" : "/app";
  } catch (err) { msg(err.message, false); }
  btn.disabled = false; btn.textContent = label;
}
$("login-form").onsubmit = e => { e.preventDefault(); signIn({ email: $("li-email").value.trim(), password: $("li-pass").value }, $("li-btn"), "Sign in"); };
$("key-form").onsubmit = e => { e.preventDefault(); signIn({ apiKey: $("ky-key").value.trim() }, $("ky-btn"), "Sign in with key"); };
</script>
</body>
</html>

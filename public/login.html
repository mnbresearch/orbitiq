<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitIQ — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#04060c; --panel:#0b101c; --stroke:rgba(90,130,200,.18); --text:#e6edfa; --dim:#7385a3; --accent:#38bdf8; --mint:#3ecf8e; --red:#f26d78; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:Inter,sans-serif; font-size:14px; min-height:100vh; display:grid; place-items:center; padding:24px;
         background-image:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,189,248,.08), transparent); }
  .box { width:min(400px, 94vw); background:var(--panel); border:1px solid var(--stroke); border-radius:16px; padding:30px 28px; }
  .brand { text-align:center; font-size:22px; font-weight:650; letter-spacing:-.015em; margin-bottom:2px; }
  .brand em { color:var(--accent); font-style:normal; }
  .sub { text-align:center; color:var(--dim); font-size:12.5px; margin-bottom:24px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:14px 0 5px; }
  input, textarea { width:100%; background:#060a15; border:1px solid var(--stroke); border-radius:9px; color:var(--text); padding:10px 12px; font:inherit; outline:none; transition:border-color .2s; }
  input:focus, textarea:focus { border-color:var(--accent); }
  button { width:100%; margin-top:20px; padding:11px; border:none; border-radius:9px; background:var(--accent); color:#04121f; font:600 13.5px Inter; cursor:pointer; transition:filter .2s; }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.5; cursor:default; }
  .alt { text-align:center; margin-top:16px; font-size:12.5px; color:var(--dim); }
  .alt a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .msg { margin-top:14px; font-size:12.5px; padding:10px 12px; border-radius:9px; display:none; }
  .msg.err { display:block; background:#2b1517; color:var(--red); border:1px solid #5c1e2a; }
  .msg.ok { display:block; background:#0f2b1d; color:var(--mint); border:1px solid #1e5c3a; }
  .back { text-align:center; margin-top:20px; font-size:12px; }
  .back a { color:var(--dim); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">Orbit<em>IQ</em></div>
  <div class="sub" id="mode-sub">Sign in to your workspace</div>

  <form id="login-form">
    <label>Email</label><input id="li-email" type="email" autocomplete="email" required>
    <label>Password</label><input id="li-pass" type="password" autocomplete="current-password" required>
    <button id="li-btn" type="submit">Sign in</button>
    <div class="alt">No account? <a id="to-request">Request access</a></div>
  </form>

  <form id="request-form" style="display:none">
    <label>Email</label><input id="rq-email" type="email" required>
    <label>Name / team</label><input id="rq-name" placeholder="e.g. ACME Space Ops">
    <label>Organization to track (optional)</label><input id="rq-org" placeholder="e.g. spacex, oneweb, planet">
    <label>What do you need? (optional)</label><textarea id="rq-msg" rows="3" placeholder="Fleet monitoring, conjunction alerts, API access…"></textarea>
    <button id="rq-btn" type="submit">Request access</button>
    <div class="alt">Have an account? <a id="to-login">Sign in</a></div>
  </form>

  <div class="msg" id="msg"></div>
  <div class="back"><a href="/">← back to the live picture</a></div>
</div>

<script>
const $ = id => document.getElementById(id);
const msg = (t, ok) => { const m = $("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); };
function mode(login) {
  $("login-form").style.display = login ? "" : "none";
  $("request-form").style.display = login ? "none" : "";
  $("mode-sub").textContent = login ? "Sign in to your workspace" : "Request access — the operator reviews every request";
  $("msg").className = "msg";
}
$("to-request").onclick = () => mode(false);
$("to-login").onclick = () => mode(true);

$("login-form").onsubmit = async e => {
  e.preventDefault();
  const b = $("li-btn"); b.disabled = true; b.textContent = "Signing in…";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("li-email").value.trim(), password: $("li-pass").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Sign-in failed");
    localStorage.setItem("orbitiq-session", d.token);
    localStorage.setItem("orbitiq-user", JSON.stringify(d.user));
    if (d.workspace && d.workspace.apiKey) localStorage.setItem("orbitiq-apikey", d.workspace.apiKey);
    msg("Welcome back" + (d.user.name ? ", " + d.user.name : "") + " — loading…", true);
    location.href = d.user.role === "admin" ? "/admin.html" : "/";
  } catch (err) { msg(err.message, false); }
  b.disabled = false; b.textContent = "Sign in";
};

$("request-form").onsubmit = async e => {
  e.preventDefault();
  const b = $("rq-btn"); b.disabled = true; b.textContent = "Submitting…";
  try {
    const r = await fetch("/api/auth/request-access", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("rq-email").value.trim(), name: $("rq-name").value.trim(), org: $("rq-org").value.trim(), message: $("rq-msg").value.trim() })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Request failed");
    msg("Request received — you'll get credentials once the operator approves it.", true);
    e.target.reset();
  } catch (err) { msg(err.message, false); }
  b.disabled = false; b.textContent = "Request access";
};
</script>
</body>
</html>
